# =====================================================================
# gradle.properties — flags globales del build
# =====================================================================

# Memoria para el daemon de Gradle (los builds de Android son golosos)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Configuration cache: Gradle cachea la FASE DE CONFIGURACIÓN completa
# (leer todos los build.gradle.kts). En builds sucesivos arranca casi
# instantáneo. Recomendación oficial actual; aún no viene activado por defecto.
org.gradle.configuration-cache=true

# Builds paralelos entre módulos independientes (multi-módulo lo aprovecha:
# :domain, :core:ui y :data pueden compilar A LA VEZ)
org.gradle.parallel=true

# AndroidX (desde AGP 9 su default ya es true; lo dejamos explícito por claridad)
android.useAndroidX=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
