# =====================================================================
# gradle-wrapper.properties — "el Gradle embebido en el repo"
# ---------------------------------------------------------------------
# El script ./gradlew lee este fichero, descarga EXACTAMENTE esta
# versión de Gradle si no la tiene, y ejecuta el build con ella.
# Garantía: todo el mundo (tú, el evaluador, un CI) compila con el
# mismo Gradle, tenga lo que tenga instalado.
# Elegimos 9.5.0 y no la última (9.7.0) a propósito: es el mínimo/default
# de AGP 9.3 Y el máximo totalmente soportado por Kotlin 2.4.x según la
# matriz oficial de JetBrains. Compatibilidad probada > novedad.
# =====================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
